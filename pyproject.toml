[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doccheck"
version = "0.1.0"
description = "Structural linter and navigability metrics for large Markdown documentation trees"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
doccheck = "doccheck:main"
docgraph = "docgraph:main"
navstamp = "navstamp:main"

# Explicit module list: the tree is intentionally flat (each tool is one
# curl-able file), so auto-discovery would both fail and ship the tests.
[tool.setuptools]
py-modules = ["doccheck", "docgraph", "navstamp"]

[tool.pytest.ini_options]
testpaths = ["."]
